schema_version: case/1
logical_key: taskboard_delete_item_static
title: Baseline tĩnh — tạo rồi xoá việc
goal: Plan tĩnh tạo việc mới rồi xoá và xác nhận việc không còn
requirements: [delete_item]

source_defs:
  delete_item:
    source_content_digest: 1b37b1a900f62fb258ea067be0549ac1521129604f18dc316566c10fefe057d0
    anchor: {type: section, value: delete-item}
    quote_digest: d77d9c5b981efab2600b3768d35a187ac85242312681821b45e8acb46707fd5a
    provenance: user

parameter_defs:
  item_name: {type: string, required: true}

fixture_refs: [taskboard@1]

nodes:
  - id: open_login
    kind: action
    operation: navigate
    value: {kind: literal, value: /login}
    side_effect: read
  - id: username
    kind: action
    operation: fill
    target: {intent: login_username, role: textbox, name: Tài khoản}
    value: {kind: secret, credential_ref: taskboard.alice.username}
    side_effect: reversible
  - id: password
    kind: action
    operation: fill
    target: {intent: login_password, role: textbox, name: Mật khẩu}
    value: {kind: secret, credential_ref: taskboard.alice.password}
    side_effect: reversible
  - id: sign_in
    kind: action
    operation: click
    target: {intent: login_submit, role: button, name: Đăng nhập}
    side_effect: external_write
  - id: item_name
    kind: action
    operation: fill
    target: {intent: new_item, role: textbox, name: Việc mới}
    value: {kind: parameter, name: item_name, type: string}
    side_effect: reversible
  - id: add_item
    kind: action
    operation: click
    target: {intent: create_item, role: button, name: Thêm việc}
    side_effect: external_write
  - id: delete_item
    kind: action
    operation: click
    target:
      intent: delete_item
      role: button
      name: Xoá
      entity_scope: {field: text, value: {kind: parameter, name: item_name, type: string}}
    side_effect: external_write
  - id: result
    kind: checkpoint
    assertions:
      - id: item_absent
        required: true
        target:
          intent: created_item_row
          role: listitem
          entity_scope: {field: text, value: {kind: parameter, name: item_name, type: string}}
        comparator: count_equals
        expected: {kind: literal, value: 0}
        source_refs: [delete_item]

completion:
  required_nodes: [delete_item, result]
  required_assertions: [item_absent]
