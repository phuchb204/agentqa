schema_version: experiment-manifest/1
experiment_id: rq1-observation
version: "1"
research_question: rq1
corpus:
  cases: [taskboard_create_item, taskboard_delete_item_healed, shopflow_cart_checkout_async]
  data_rows: []
arms:
  - arm_id: agent_llm_hybrid
    mode: agent
    policy: llm
    observation: hybrid
    cohorts: [default]
  - arm_id: agent_llm_vision_first
    mode: agent
    policy: llm
    observation: vision_first
    cohorts: [default]
randomisation: {block_seed: 20261010, order: randomised}
samples:
  unit: case_family
  confidence: 0.95
  non_inferiority_margin: 0.05
  pilot_ref: benchmarks/calibration/manifest.yaml
  repetitions: 1
budgets:
  max_calls: 600
  max_cost_usd: 20.0
  routes:
    opencode_go: deepseek-v4.1-flash
    opencode_zen: jev-1.13-free
cache: {bypass_local: true, record_provider_cache: true}
analysis:
  primary_endpoints: [oracle_task_success]
  comparisons: [[agent_llm_hybrid, agent_llm_vision_first]]
  bootstrap_seed: 20261010
  bootstrap_replicates: 10000
  multiple_comparison: holm
profile_refs: {}
price_receipts: []
capability_receipts: []
seeds: [20261010]
