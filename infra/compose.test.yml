name: agentqa-test

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: agentqa_bootstrap
      POSTGRES_PASSWORD: agentqa_test_local_only
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${AGENTQA_TEST_PGPORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentqa_bootstrap -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql
