name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: agentqa_bootstrap
          POSTGRES_PASSWORD: agentqa_test_local_only
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U agentqa_bootstrap -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.7"
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: uv python install
      - run: uv sync --locked
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web build
      - run: uv run --locked playwright install chromium --with-deps
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked lint-imports
      - run: uv run --locked pytest -q
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-e2e-failure
          path: artifacts/ui-e2e
          if-no-files-found: ignore
          retention-days: 7
      - run: uv run --locked python tools/export_schemas.py --check
      - run: uv run --locked python tools/check_plan_coverage.py
      - run: uv run --locked python tools/run_os_profile_smoke.py --profile linux

  python-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.7"
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked
      - run: uv run --locked playwright install chromium
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked lint-imports
      - run: uv run --locked python tools/export_schemas.py --check
      - run: uv run --locked python tools/check_plan_coverage.py
      - run: uv run --locked pytest -q tests/contracts tests/foundation tests/acceptance
      - run: uv run --locked python tools/run_os_profile_smoke.py --profile windows

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web format:check
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web build
