schema_version: case/1
logical_key: branch_flow
title: Nhánh dữ liệu động
goal: Đi theo nhánh phụ thuộc tham số
requirements: [branch_requirement]

source_defs:
  branch_requirement:
    source_content_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    anchor: {type: section, value: branch}
    quote_digest: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    provenance: user

parameter_defs:
  mode: {type: string, required: true}

nodes:
  - id: open
    kind: action
    operation: navigate
    value: {kind: literal, value: /start}
    side_effect: read
  - id: decide
    kind: branch
    condition:
      kind: comparison
      comparator: equals
      expected: {kind: parameter, name: mode, type: string}
    then_nodes:
      - id: then_check
        kind: checkpoint
        assertions:
          - id: then_ok
            required: true
            comparator: url_path_equals
            expected: {kind: literal, value: /done}
            source_refs: [branch_requirement]
    else_nodes:
      - id: else_check
        kind: checkpoint
        assertions:
          - id: else_ok
            required: true
            comparator: url_path_equals
            expected: {kind: literal, value: /wait}
            source_refs: [branch_requirement]

completion:
  required_nodes: [open, then_check, else_check]
  required_assertions: [then_ok, else_ok]
