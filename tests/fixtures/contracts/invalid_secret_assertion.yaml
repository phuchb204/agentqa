schema_version: case/1
logical_key: secret_assertion
title: Secret trong assertion
goal: Kiểm tra secret trong kỳ vọng
requirements: []

source_defs:
  requirement:
    source_content_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    anchor: {type: section, value: secret}
    quote_digest: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    provenance: user

nodes:
  - id: open
    kind: action
    operation: navigate
    value: {kind: literal, value: /start}
    side_effect: read
  - id: check
    kind: checkpoint
    assertions:
      - id: uses_secret
        required: true
        comparator: text_equals
        expected: {kind: secret, credential_ref: demo_login.token}
        source_refs: [requirement]

completion:
  required_nodes: [open, check]
  required_assertions: [uses_secret]
